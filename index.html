<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京都大阪九日行</title>
<meta name="description" content="2026/11/15–11/23 京都・宇治・姬路・大阪 九天八夜自助旅行行程">
<meta name="theme-color" content="#b23a2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2ea; --paper:#fffdf9; --ink:#2b2522; --muted:#7a6f66; --line:#e6dccf;
  --accent:#b23a2b; --accent-soft:#f6e1dc; --gold:#c98a1b; --gold-soft:#fbefd6;
  --move:#3d6b8c; --move-soft:#e2edf4; --spot:#4b7a4a; --spot-soft:#e4efe1;
  --food:#c0602a; --food-soft:#fae6d8; --hotel:#6c5596; --hotel-soft:#ece6f5;
  --rest:#8a8078; --rest-soft:#efebe6; --flight:#b23a2b;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1816; --paper:#25211e; --ink:#efe8df; --muted:#a69a8f; --line:#3a332e;
    --accent:#e0705e; --accent-soft:#3d2622; --gold:#e3ac4a; --gold-soft:#3a2f1c;
    --move:#7fb0d3; --move-soft:#1f2c36; --spot:#8fc28c; --spot-soft:#1f2d1f;
    --food:#e89a68; --food-soft:#3a281c; --hotel:#b39de0; --hotel-soft:#2b2438;
    --rest:#a69a8f; --rest-soft:#2d2825; --flight:#e0705e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1816; --paper:#25211e; --ink:#efe8df; --muted:#a69a8f; --line:#3a332e;
  --accent:#e0705e; --accent-soft:#3d2622; --gold:#e3ac4a; --gold-soft:#3a2f1c;
  --move:#7fb0d3; --move-soft:#1f2c36; --spot:#8fc28c; --spot-soft:#1f2d1f;
  --food:#e89a68; --food-soft:#3a281c; --hotel:#b39de0; --hotel-soft:#2b2438;
  --rest:#a69a8f; --rest-soft:#2d2825; --flight:#e0705e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}

/* header */
header.hero{padding-top:28px;padding-bottom:14px}
.hero .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,7vw,38px);line-height:1.2;margin:6px 44px 6px 0}
.hero p{margin:0;color:var(--muted);font-size:14px}
.theme-btn{position:absolute;top:18px;right:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs .row{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs .row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center;min-width:58px;font-family:inherit}
.tab .d{display:block;font-weight:700;font-size:15px;line-height:1.2}
.tab .w{display:block;font-size:11px;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on .w{color:#ffe6e0}
.tab.has-flight::after{content:"✈";display:block;font-size:10px;line-height:1}
.tab .today{display:block;font-size:10px;font-weight:700;color:var(--gold)}
.tab.on .today{color:#ffe7a8}

/* day header */
.dayhead{padding:20px 0 6px}
.dayhead .n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.12em}
.dayhead h2{font-family:"Noto Serif TC",serif;font-size:24px;margin:2px 0 4px;line-height:1.3}
.dayhead .sum{color:var(--muted);font-size:14px}
.dayhead .stay{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;background:var(--hotel-soft);color:var(--hotel);padding:3px 10px;border-radius:999px;text-decoration:none}
.daynav{display:flex;justify-content:space-between;gap:10px;margin:22px 0 8px}
.daynav button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px;font:inherit;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0 4px}
.alert .ic{font-size:22px;line-height:1.2}
.alert b{display:block;font-size:16px}
.alert .big{font-size:26px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.alert small{color:var(--muted);display:block;margin-top:2px}

/* flight card */
.flight{background:var(--paper);border:2px solid var(--flight);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.flight .top{background:var(--flight);color:#fff;padding:6px 14px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.flight .body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px;gap:8px}
.flight .ap{font-size:12px;color:var(--muted)}
.flight .code{font-size:24px;font-weight:700;letter-spacing:.05em}
.flight .tm{font-size:22px;font-weight:700;color:var(--flight);font-variant-numeric:tabular-nums}
.flight .mid{text-align:center;color:var(--muted);font-size:20px}
.flight .r{text-align:right}

/* timeline */
.tl{list-style:none;margin:16px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:62px;top:6px;bottom:6px;width:2px;background:var(--line)}
.it{display:grid;grid-template-columns:52px 22px 1fr;gap:0 8px;margin-bottom:12px;position:relative}
.it .time{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding-top:9px;line-height:1.2}
.it .time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.it .dot{width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--c);margin:11px auto 0;position:relative;z-index:1}
.it .card{background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border-left:4px solid var(--c);min-width:0}
.it .kind{display:inline-block;font-size:11px;font-weight:700;color:var(--c);background:var(--cs);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.it .tag{display:inline-block;font-size:11px;font-weight:700;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
.it .ti{font-weight:700;font-size:15.5px;word-break:break-word}
.it .note{color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.it .note strong{color:var(--accent)}
.it .imp{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 8px}
.it.opt .card{background:transparent;border:1.5px dashed var(--line);border-left:4px dashed var(--c);box-shadow:none}
.it.opt .ti{font-weight:500}
.it.now .card{outline:2px solid var(--gold);outline-offset:2px}
.it.now .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.it.flightrow .card{padding:0;border-left:none;background:none;box-shadow:none}
.k-move{--c:var(--move);--cs:var(--move-soft)}
.k-spot{--c:var(--spot);--cs:var(--spot-soft)}
.k-food{--c:var(--food);--cs:var(--food-soft)}
.k-hotel{--c:var(--hotel);--cs:var(--hotel-soft)}
.k-rest{--c:var(--rest);--cs:var(--rest-soft)}
.k-flight,.k-airport{--c:var(--flight);--cs:var(--accent-soft)}
.it.k-airport .card{background:var(--gold-soft);border-left-color:var(--gold)}
.it.k-airport .dot{border-color:var(--gold)}

details.sec{margin-top:8px}
details.sec summary{display:inline-flex;align-items:center;gap:4px;cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:8px;padding:2px 9px;user-select:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"▾";font-size:11px}
details.sec[open] summary{color:var(--accent);border-color:var(--accent);border-style:solid}
details.sec[open] summary::after{content:"▴"}
details.sec dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:13.5px}
details.sec dt{color:var(--muted)}
details.sec dd{margin:0;font-weight:500;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--ink);line-height:1.3;max-width:100%}
.chip:hover,.chip:active{border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.chip .pin{font-size:12px}
.chip.nav{background:var(--cs);border-color:transparent;color:var(--c)}

/* info */
details.info{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);margin:18px 0 0;overflow:hidden}
details.info summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:"＋";color:var(--muted)}
details.info[open] summary::after{content:"－"}
.info .grp{padding:0 14px 10px}
.hotel.gift{border-left-color:var(--food)}
.hotel.gift.done{border-left-color:var(--spot)}
.gift .meta{white-space:pre-line}
.gift .where{padding:6px 0;border-top:1px solid var(--line)}
.gift .where:first-of-type{border-top:none}
.gift .where .hr{font-size:13px;color:var(--muted);margin-top:3px}
.info.market{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);margin:14px 0 0;padding-top:10px}
.info h4{margin:6px 0 6px;font-size:13px;color:var(--accent);letter-spacing:.08em}
.shop{padding:8px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:none}
.shop .nm{font-weight:500}
.shop .hr{font-size:13px;color:var(--muted)}
.shop .lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.shop .lk a{font-size:12.5px;text-decoration:none;border-radius:6px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
.shop .lk a.g{color:var(--move)}
.shop .lk a.t{color:var(--food)}

/* hotels */
.hotel{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin:12px 0;border-left:4px solid var(--hotel)}
.hotel .nm{font-weight:700;font-size:16px}
.hotel .meta{color:var(--muted);font-size:13.5px;margin:4px 0 8px}
.flights2{display:grid;gap:12px;margin-top:12px}

.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0 40px}

@media (max-width:420px){
  .tl::before{left:52px}
  .it{grid-template-columns:44px 18px 1fr;gap:0 6px}
  .it .time{font-size:13px}
  .flight .code{font-size:20px}.flight .tm{font-size:19px}
}
</style>
</head>

/* ---------- render ---------- */
const KIND = {airport:'出發',flight:'航班',move:'交通',spot:'景點',food:'用餐',hotel:'住宿',rest:'休息'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUrl = s => /^https?:/.test(s);
const searchUrl = q => isUrl(q) ? q : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const navUrl = q => isUrl(q) ? q : 'https://www.google.com/maps/dir/?api=1&travelmode=transit&destination=' + encodeURIComponent(q);

function chip(p, nav){
  const [label, q] = Array.isArray(p) ? p : [p, p];
  const href = nav ? navUrl(q) : searchUrl(q);
  return `<a class="chip${nav?' nav':''}" href="${esc(href)}" target="_blank" rel="noopener"><span class="pin">${nav?'🧭':'📍'}</span>${esc(label)}</a>`;
}
function secBox(label, rows){
  return `<details class="sec"><summary>🔒 ${esc(label)}</summary><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>`;
}
function flightCard(f){
  return `<div class="flight"><div class="top"><span>✈ ${esc(f.no)}</span><span>${esc(f.date)}</span></div>
  <div class="body"><div><div class="code">${f.from}</div><div class="tm">${f.dep}</div><div class="ap">${esc(f.fromN)}</div></div>
  <div class="mid">→</div>
  <div class="r"><div class="code">${f.to}</div><div class="tm">${f.arr}</div><div class="ap">${esc(f.toN)}</div></div></div></div>`;
}
function item(x, isNow){
  const cls = ['it','k-'+x.k]; if(x.opt) cls.push('opt'); if(isNow) cls.push('now'); if(x.k==='flight') cls.push('flightrow');
  const time = x.t ? `${esc(x.t)}${x.e?`<small>${esc(x.e)}</small>`:''}` : '';
  let body;
  if(x.k==='flight'){
    body = flightCard(x.fl) + (x.n?`<div class="note" style="padding:6px 4px 0">${esc(x.n)}</div>`:'');
  } else {
    const p = (x.p||[]).map(v => chip(v, x.nav)).join('');
    const l = (x.links||[]).map(([a,u]) => `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">🔗 ${esc(a)}</a>`).join('')
      + (x.go ? `<button class="chip" style="cursor:pointer;font:inherit;font-size:13px" data-go="${esc(x.go[1])}">${esc(x.go[0])}</button>` : '');
    body = `<div class="ti">${x.tag?`<span class="tag">${esc(x.tag)}</span>`:''}<span class="kind">${KIND[x.k]}</span>${esc(x.ti)}</div>
      ${x.n?`<div class="note">${esc(x.n)}</div>`:''}
      ${x.imp?`<div class="imp">${esc(x.imp)}</div>`:''}
      ${p||l?`<div class="chips">${p}${l}</div>`:''}
      ${x.sec?secBox(x.sec.l, x.sec.r):''}`;
  }
  return `<li class="${cls.join(' ')}"><div class="time">${time}</div><div class="dot"></div><div class="card">${body}</div></li>`;
}
function shop(s){
  const links = [];
  if(s.g||s.q) links.push(`<a class="g" href="${esc(s.g?G(s.g):searchUrl(s.q))}" target="_blank" rel="noopener">📍 Google 地圖${s.gr?' '+s.gr:''}</a>`);
  if(s.tb||s.tbu) links.push(`<a class="t" href="${esc(s.tbu||TB(s.tb))}" target="_blank" rel="noopener">Tabelog${s.tr?' '+s.tr:''}</a>`);
  return `<div class="shop"><div class="nm">${esc(s.n)}</div>${s.hr?`<div class="hr">${esc(s.hr)}</div>`:''}<div class="lk">${links.join('')}</div></div>`;
}

/* 日本時間的「現在」 */
function jstNow(){
  const d = new Date(Date.now() + 9*3600e3);
  return {date:d.toISOString().slice(0,10), min:d.getUTCHours()*60+d.getUTCMinutes()};
}
const toMin = t => { const m = /^~?(\d{1,2}):(\d{2})$/.exec(t||''); return m ? +m[1]*60 + +m[2] : null; };

function renderDay(i){
  const d = DAYS[i], now = jstNow();
  let nowIdx = -1;
  if(now.date === d.date){
    d.items.forEach((x,j) => { const m = toMin(x.t); if(m!==null && m<=now.min && !x.opt) nowIdx = j; });
  }
  const stay = d.stay ? `<a class="stay" href="${esc(d.stay[1])}" target="_blank" rel="noopener">🏨 住：${esc(d.stay[0])}</a>` : '';
  const alert = d.alert ? `<div class="alert"><div class="ic">${d.alert.ic}</div><div><div class="big">${d.alert.time}</div><b>${esc(d.alert.head)}</b><small>${esc(d.alert.sub)}</small></div></div>` : '';
  const info = d.info ? `<details class="info"><summary>當日備用資訊（超市・美食・伴手禮）</summary>${d.info.map(g=>`<div class="grp"><h4>${esc(g.h)}</h4>${g.l.map(shop).join('')}</div>`).join('')}</details>` : '';
  document.getElementById('main').innerHTML = `
    <section class="dayhead"><div class="n">DAY ${i+1} · ${d.md}（${d.wd}）</div><h2>${esc(d.title)}</h2><div class="sum">${esc(d.sum)}</div>${stay}</section>
    ${alert}
    <div class="legend">${['move','spot','food','hotel'].map(k=>`<span class="k-${k}"><i></i>${KIND[k]}</span>`).join('')}<span>📍 地圖位置　🧭 大眾運輸導航</span></div>
    <ol class="tl">${d.items.map((x,j)=>item(x, j===nowIdx)).join('')}</ol>
    ${info}
    <div class="daynav"><button ${i===0?'disabled':''} data-go="${i-1}">← 前一天</button><button data-go="${i+1<DAYS.length?i+1:'hotels'}">${i+1<DAYS.length?'後一天 →':'住宿・航班 →'}</button></div>`;
}
function renderHotels(){
  const f = DAYS.flatMap(d => d.items.filter(x=>x.k==='flight').map(x=>x.fl));
  document.getElementById('main').innerHTML = `
    <section class="dayhead"><div class="n">INFO</div><h2>住宿與航班</h2><div class="sum">星宇航空・桃園 第一航廈 ⇄ 關西 第一航廈</div></section>
    <div class="flights2">${f.map(flightCard).join('')}</div>
    <div class="alert"><div class="ic">⏰</div><div><b>出發去機場時間</b><small>11/15（日）05:30 從家開車出發往桃園機場（約 1 小時）<br>11/23（一）07:40 前退房，步行至 OCAT 搭 08:00 利木津巴士</small></div></div>
    ${HOTELS.map(h=>`<div class="hotel"><div class="nm">${esc(h.n)}</div><div class="meta">${esc(h.area)}｜${esc(h.d)}<br>${esc(h.r)}</div><div class="chips"><a class="chip" href="${G(h.g)}" target="_blank" rel="noopener"><span class="pin">📍</span>Google 地圖</a><a class="chip nav k-hotel" href="${G(h.g)}" target="_blank" rel="noopener"><span class="pin">🧭</span>導航</a></div>${secBox('訂房資料', h.sec)}</div>`).join('')}
    <div class="daynav"><button data-go="${DAYS.length-1}">← 最後一天</button><button data-go="gift">伴手禮 →</button></div>`;
}

function renderGifts(){
  document.getElementById('main').innerHTML = `
    <section class="dayhead"><div class="n">SOUVENIRS</div><h2>伴手禮清單</h2><div class="sum">11/15（日）晚上在京都車站一次買齊；點 📍 開啟 Google 地圖</div></section>
    <div class="alert"><div class="ic">🎁</div><div><b>11/15 18:50–19:40 京都車站</b><small>JR 京都伊勢丹 B1F（満月）→ 京都車站大樓 1F 京小町（HOHO、KNOU）→ 八条口（マールブランシュ）<br>伊勢丹 20:00 關門，先去伊勢丹</small></div></div>
    ${GIFTS.map(g=>`<div class="hotel gift${g.done?' done':''}">
      <div class="nm">${esc(g.n)}${g.done?` <span class="imp" style="margin:0 0 0 6px">✓ ${esc(g.done)}</span>`:''}</div>
      <div class="meta">${esc(g.item)}</div>
      ${g.w.map(([l,q,note])=>`<div class="where"><a class="chip" href="${esc(searchUrl(q))}" target="_blank" rel="noopener"><span class="pin">📍</span>${esc(l)}</a>${note?`<div class="hr">${esc(note)}</div>`:''}</div>`).join('')}
    </div>`).join('')}
    <div class="daynav"><button data-go="hotels">← 住宿・航班</button><button data-go="market">超市 →</button></div>`;
}

function renderMarkets(){
  document.getElementById('main').innerHTML = `
    <section class="dayhead"><div class="n">SUPERMARKET</div><h2>超市</h2><div class="sum">依住宿地點整理，點 📍 開啟 Google 地圖</div></section>
    ${MARKETS.map(g=>`<div class="info market"><div class="grp"><h4>${esc(g.h)}</h4>${g.l.map(shop).join('')}</div></div>`).join('')}
    <div class="daynav"><button data-go="gift">← 伴手禮</button><button data-go="0">回到第一天</button></div>`;
}

const tabs = document.getElementById('tabs');
function renderTabs(cur){
  const today = jstNow().date;
  tabs.innerHTML = DAYS.map((d,i)=>`<button class="tab${cur===i?' on':''}${d.items.some(x=>x.k==='flight')?' has-flight':''}" data-go="${i}"><span class="d">${d.md}</span><span class="w">週${d.wd}</span>${d.date===today?'<span class="today">今天</span>':''}</button>`).join('')
    + `<button class="tab${cur==='hotels'?' on':''}" data-go="hotels"><span class="d">🏨</span><span class="w">住宿航班</span></button>`
    + `<button class="tab${cur==='gift'?' on':''}" data-go="gift"><span class="d">🎁</span><span class="w">伴手禮</span></button>`
    + `<button class="tab${cur==='market'?' on':''}" data-go="market"><span class="d">🛒</span><span class="w">超市</span></button>`;
  const on = tabs.querySelector('.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
}
function go(key, push=true){
  const k = ['hotels','gift','market'].includes(key) ? key : Math.max(0, Math.min(DAYS.length-1, +key||0));
  renderTabs(k);
  if(k==='hotels') renderHotels(); else if(k==='gift') renderGifts(); else if(k==='market') renderMarkets(); else renderDay(k);
  if(push) history.replaceState(null,'', typeof k==='string' ? '#'+k : '#day'+(k+1));
  window.scrollTo({top:0});
  const now = document.querySelector('.it.now');
  if(now) now.scrollIntoView({block:'center'});
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});
function initial(){
  const h = location.hash;
  if(h==='#hotels') return 'hotels';
  if(h==='#market') return 'market';
  if(h==='#gift') return 'gift';
  const m = /^#day(\d)$/.exec(h); if(m) return +m[1]-1;
  const i = DAYS.findIndex(d => d.date === jstNow().date);
  return i >= 0 ? i : 0;
}
go(initial(), false);

/* 深淺色切換 */
const root = document.documentElement;
try{ const t = localStorage.getItem('theme'); if(t) root.dataset.theme = t; }catch(e){}
document.getElementById('themeBtn').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try{ localStorage.setItem('theme', root.dataset.theme); }catch(e){}
};
